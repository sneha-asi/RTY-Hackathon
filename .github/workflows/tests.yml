name: Shield tests (offline)

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (runtime + tests only; no account credentials)
        run: pip install -e ".[test]"
      - name: Run tests with FakeMail
        env:
          SHIELD_MAIL: fake
        run: python -m pytest -q
